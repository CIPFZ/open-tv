<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08090c" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" />
  <title>Open TV</title>
  <script type="module" src="/src/renderer/app.ts"></script>
</head>
<body>
  <main id="tvApp" class="tv-app">
    <section id="stage" class="stage" aria-label="直播播放区" tabindex="0">
      <video id="video" playsinline preload="auto"></video><div class="window-drag-region" aria-hidden="true"></div><div class="stage-vignette"></div>
      <div id="stageEmpty" class="stage-empty"><div class="stage-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M6.5 3.5v17l14-8.5-14-8.5Z"/></svg></div><h1 id="stageEmptyTitle">你的网络电视</h1><p id="stageEmptyText">添加播放列表，开始观看</p><button id="retryButton" class="action-button hidden">重试播放</button></div>
      <div id="bufferingOverlay" class="buffering-overlay hidden" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><span id="bufferingLabel">正在缓冲…</span></div>
      <header class="watch-header"><div class="brand-lockup"><span class="brand-mark">▶</span>Open TV</div><div class="watch-status"><i class="live-dot"></i><b id="liveStatus">READY</b><span>·</span><span id="sourceLabel">未添加来源</span></div></header>
      <div class="now-playing-overlay"><span id="channelNumber" class="channel-number">—</span><div><p id="liveBadge" class="live-label" hidden>● LIVE</p><h2 id="channelTitle">Open TV</h2><p id="channelGroup" class="channel-group">从一个播放列表开始</p></div><button class="channel-browse-button control-button" data-action="open-channels" aria-label="打开频道列表" data-tooltip="频道列表 · C"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button></div>
      <div id="playbackMessage" class="playback-message hidden"></div>
      <div id="controlDock" class="control-dock"><div class="transport-group" aria-label="播放控制"><button class="control-button" data-action="previous" aria-label="上一台" data-tooltip="上一台 · ↑"><span class="transport-icon previous-icon" aria-hidden="true"></span></button><button id="playButton" class="control-button main-control" data-action="toggle-play" aria-label="播放" data-tooltip="播放 · Space"><span class="control-icon play-icon" aria-hidden="true"><svg class="play-svg" viewBox="0 0 24 24" focusable="false"><path d="M8 5v14l11-7-11-7Z"/></svg><svg class="pause-svg" viewBox="0 0 24 24" focusable="false"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg></span></button><button class="control-button" data-action="next" aria-label="下一台" data-tooltip="下一台 · ↓"><span class="transport-icon next-icon" aria-hidden="true"></span></button></div><span class="control-divider"></span><div class="volume-control" role="group" aria-label="音量"><button id="muteButton" class="volume-button" data-action="toggle-mute" aria-label="静音" data-tooltip="静音"><span class="volume-icon" aria-hidden="true"><svg class="volume-svg" viewBox="0 0 24 24" focusable="false"><path d="M4 10v4h3l4 3V7l-4 3H4Z"/><path d="M15 9.5a4 4 0 0 1 0 5"/><path d="M17.5 7a7.5 7.5 0 0 1 0 10"/></svg><svg class="mute-svg" viewBox="0 0 24 24" focusable="false"><path d="M4 10v4h3l4 3V7l-4 3H4Z"/><path d="m15 9 6 6m0-6-6 6"/></svg></span></button><input id="volumeSlider" type="range" min="0" max="100" value="70" /><output id="volumeValue">70%</output></div><span class="control-divider"></span><div class="utility-group" aria-label="窗口工具"><button id="fullscreenButton" class="control-button utility-button" data-action="toggle-fullscreen" aria-label="全屏" data-tooltip="进入全屏 · F"><svg class="utility-icon fullscreen-enter-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><svg class="utility-icon fullscreen-exit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button><button class="control-button utility-button settings-button" data-action="open-settings" aria-label="打开设置" data-tooltip="打开设置 · S"><svg class="utility-icon settings-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.37-.31-.6-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.5.42L9.12 5.07c-.61.25-1.18.59-1.69.98l-2.49-1c-.23-.08-.48 0-.6.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.08.65-.08.98s.03.66.08.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.37.31.6.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.18-.58 1.69-.98l2.49 1c.23.08.48 0 .6-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg></button></div></div>
    </section><div id="osdToast" class="osd-toast" aria-live="polite"></div>
  </main>
  <aside id="channelDrawer" class="drawer" role="dialog" aria-modal="true" aria-label="频道列表" aria-hidden="true"><div class="drawer-header"><div><h2>频道列表</h2></div><button class="drawer-close" data-action="close-drawer">×</button></div><label class="drawer-search">⌕<input id="channelSearch" type="search" placeholder="搜索频道或频道号" /></label><div id="groupFilters" class="drawer-filters"></div><div id="channelList" class="drawer-list"></div></aside>
  <aside id="settingsDrawer" class="drawer wide-drawer settings-drawer" role="dialog" aria-modal="true" aria-label="设置" aria-hidden="true"><div class="drawer-header"><div><h2>设置</h2><span id="settingsSaveStatus" class="setting-save-status" aria-live="polite"></span></div><button class="drawer-close" data-action="close-drawer">×</button></div>
    <section id="settingsSources" class="settings-section"><h3>播放列表来源</h3><p class="setting-note">添加、刷新或切换你有权观看的 HTTPS M3U/M3U8 来源。</p><div class="playlist-actions"><button class="action-button" data-action="add-playlist">＋ 添加来源</button><button class="text-action" data-action="refresh-active">↻ 刷新当前</button></div><div id="playlistList" class="playlist-list"></div><div id="sourceFormPanel" class="source-form hidden"><div class="form-header"><strong>添加来源</strong><button class="text-action" data-action="cancel-source">取消</button></div><label class="field-label">来源名称<input id="playlistName" class="text-input" maxlength="80" /></label><label class="field-label">HTTPS URL<input id="playlistUrl" class="text-input" type="url" placeholder="https://example.com/channels.m3u" /></label><div class="form-or">或</div><button class="file-picker" data-action="import-file">选择本地 M3U/M3U8 <small id="fileName">未选择文件</small></button><input id="playlistFile" type="file" accept=".m3u,.m3u8,.txt" hidden /><div class="sample-row"><span>研发样本</span><button class="preset-button" data-sample="https://iptv-org.github.io/iptv/countries/cn.m3u">中国频道</button><button class="preset-button" data-sample="https://iptv-org.github.io/iptv/categories/news.m3u">新闻频道</button></div><p id="sourceError" class="form-error"></p><button id="saveSourceButton" class="action-button primary-action" data-action="save-source">加载并启用</button></div></section>
    <section class="settings-section"><h3>播放</h3><label class="setting-row">启动时自动播放<input class="toggle" type="checkbox" data-setting="autoPlay" /></label><label class="setting-row">记住上次音量<input class="toggle" type="checkbox" data-setting="rememberVolume" /></label><label class="setting-row">自动进入全屏<input class="toggle" type="checkbox" data-setting="autoFullscreen" /></label></section>
    <section class="settings-section"><h3>播放稳定性</h3><label class="field-label">网络超时（毫秒）<input class="text-input" type="number" min="3000" max="60000" step="1000" data-setting="networkTimeout" /></label><label class="field-label">自动重试次数<input class="text-input" type="number" min="0" max="5" step="1" data-setting="retryCount" /></label></section>
    <section class="settings-section"><h3>诊断</h3><button class="setting-link" data-action="export-diagnostics">导出诊断信息</button><p id="appVersion" class="setting-note">Open TV</p></section>
  </aside>
  <div id="drawerBackdrop" class="drawer-backdrop hidden" data-action="close-drawer"></div>
</body></html>
