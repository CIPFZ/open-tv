name: Open TV builds
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:contract
      - run: npm test
      - run: npm run pack:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: open-tv-${{ matrix.os }}
          path: release/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: gradle -p platforms/android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: open-tv-android-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
